[package]
name = "rulezenex"
version = "0.1.0"
edition = "2021"
publish = false
description = "GoRules ZEN (JDM decision graphs) as an Erlang NIF."

[lib]
name = "rulezenex"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
zen-engine = "=2.1.6"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
strip = "symbols"
lto = "thin"
