name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rules-${{ hashFiles('mix.lock', 'native/rules/Cargo.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: cargo fmt --check --manifest-path native/rules/Cargo.toml
      - run: cargo clippy --manifest-path native/rules/Cargo.toml -- -D warnings
      - run: mix test
